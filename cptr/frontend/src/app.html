<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#000000" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Computer" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="apple-touch-startup-image" href="/icon-512.png" />
		<script>
			// Boot splash colors from the last loaded appearance (cached by
			// rememberBootTheme), so it paints in the user's theme before the app loads.
			(function () {
				var root = document.documentElement;
				var cached = null;
				try {
					cached = JSON.parse(localStorage.getItem('cptr:boot-theme') || 'null');
				} catch (e) {}
				var dark = cached
					? !!cached.dark
					: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
				root.classList.add(dark ? 'boot-dark' : 'boot-light');
				if (cached && cached.bg) root.style.setProperty('--boot-bg', cached.bg);
			})();
		</script>
		<style>
			#boot-splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--boot-bg, #ffffff);
				color: rgba(0, 0, 0, 0.88);
				transition:
					opacity 520ms cubic-bezier(0.4, 0, 0.2, 1),
					visibility 0s linear 520ms;
			}
			.boot-dark #boot-splash {
				background: var(--boot-bg, #0d0d0d);
				color: rgba(255, 255, 255, 0.92);
			}
			/* The OI mark on a rounded tile, as on the sign-in page. */
			#boot-splash .boot-logo {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 4.5rem;
				height: 4.5rem;
				border-radius: 1.125rem;
				color: #0a0a0a;
				background: linear-gradient(180deg, #ffffff 0%, #f4f4f5 100%);
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.9),
					0 0 0 1px rgba(24, 24, 27, 0.06),
					0 2px 4px rgba(24, 24, 27, 0.05),
					0 12px 28px -8px rgba(24, 24, 27, 0.22);
				animation:
					boot-logo-in 560ms cubic-bezier(0.22, 1, 0.36, 1) both,
					boot-logo-glow 1.6s ease-in-out 560ms infinite;
				transition:
					transform 520ms cubic-bezier(0.22, 1, 0.36, 1),
					filter 520ms ease;
			}
			#boot-splash .boot-logo svg {
				width: 2.25rem;
				height: auto;
			}
			.boot-dark #boot-splash .boot-logo {
				color: #fafafa;
				background: linear-gradient(180deg, #2c2c30 0%, #1c1c1f 100%);
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.09),
					0 0 0 1px rgba(255, 255, 255, 0.08),
					0 2px 4px rgba(0, 0, 0, 0.3),
					0 12px 28px -8px rgba(0, 0, 0, 0.6);
				animation-name: boot-logo-in, boot-logo-glow-dark;
			}
			#boot-splash.is-leaving {
				opacity: 0;
				visibility: hidden;
			}
			#boot-splash.is-leaving .boot-logo {
				transform: scale(1.12);
				filter: blur(6px);
				animation: none;
			}
			@keyframes boot-logo-in {
				from {
					opacity: 0;
					transform: scale(0.86);
				}
			}
			@keyframes boot-logo-glow {
				50% {
					box-shadow:
						inset 0 1px 0 rgba(255, 255, 255, 0.9),
						0 0 0 1px rgba(24, 24, 27, 0.06),
						0 2px 4px rgba(24, 24, 27, 0.05),
						0 16px 36px -6px rgba(24, 24, 27, 0.3);
				}
			}
			@keyframes boot-logo-glow-dark {
				50% {
					box-shadow:
						inset 0 1px 0 rgba(255, 255, 255, 0.09),
						0 0 0 1px rgba(255, 255, 255, 0.12),
						0 2px 4px rgba(0, 0, 0, 0.3),
						0 0 32px rgba(255, 255, 255, 0.08);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot-splash,
				#boot-splash .boot-logo {
					animation: none;
					transition: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-splash" aria-hidden="true">
			<div class="boot-logo">
				<svg viewBox="0 0 200 148" aria-hidden="true">
					<circle cx="74" cy="74" r="59.5" fill="none" stroke="currentColor" stroke-width="29" />
					<rect x="171" y="0" width="29" height="148" fill="currentColor" />
				</svg>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
